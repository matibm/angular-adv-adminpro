<div class="card">
  <div class="card-header">
    <h4 class="card-title mb-0">Configuración de Pagos Online</h4>
    <p class="text-muted mb-0 small">Cobrador y fondo por defecto al registrar pagos desde PagoPar</p>
  </div>
  <div class="card-body">
    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
    </div>

    <div *ngIf="!loading" class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Cobrador por defecto</label>
        <select class="form-select" [(ngModel)]="cobradorId">
          <option [ngValue]="null">-- Sin definir (usa el de la factura) --</option>
          <option *ngFor="let c of cobradores" [ngValue]="c._id">{{ getNombre(c) }}</option>
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Fondo por defecto</label>
        <select class="form-select" [(ngModel)]="fondoId">
          <option [ngValue]="null">-- Sin definir (usa el de la factura) --</option>
          <option *ngFor="let f of fondos" [ngValue]="f._id">{{ getNombre(f) }}</option>
        </select>
      </div>
    </div>

    <div *ngIf="!loading" class="mt-3">
      <button type="button" class="btn btn-primary" (click)="guardar()" [disabled]="saving">
        <span *ngIf="saving" class="spinner-border spinner-border-sm me-1"></span>
        Guardar configuración
      </button>
    </div>
  </div>
</div>
